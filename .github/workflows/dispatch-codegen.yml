name: Dispatch Codegen

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch-codegen:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Get token
        uses: actions/create-github-app-token@v3.2.0 # This release is immutable, so pinning to a commit is not necessary
        id: app-token
        with:
          app-id: ${{ secrets.EIN_CODEGEN_APP_ID }}
          private-key: ${{ secrets.EIN_CODEGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          skip-token-revoke: true
          repositories: |
            einnsyn-codegen

      - name: Build dispatch payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Look up the pull request this commit came from, if any. Works for
          # merge, squash and rebase merges, and returns [] for direct pushes.
          PR_JSON=$(gh api "/repos/${REPO}/commits/${SHA}/pulls")
          PR_NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.[0].number // ""')
          PR_TITLE=$(printf '%s' "$PR_JSON" | jq -r '.[0].title // ""')

          if [ -n "$PR_NUMBER" ]; then
            COMMIT_MESSAGE="Triggered from ${REPO}#${PR_NUMBER}"
            PR_BODY="Triggered from ${REPO} [#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER}) ${PR_TITLE}"
          else
            COMMIT_MESSAGE="Triggered from ${REPO}"
            PR_BODY="Triggered from ${REPO}"
          fi

          # Let jq do the JSON escaping: the PR title is untrusted input and
          # must not be able to break out of its string in the payload.
          jq -nc \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg pr_body "$PR_BODY" \
            '{$commit_message, $pr_body}' > payload.json
          echo "json=$(cat payload.json)" >> "$GITHUB_OUTPUT"

      - name: Dispatch workflow
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # pin@v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: felleslosninger/einnsyn-codegen
          event-type: codegen
          client-payload: ${{ steps.payload.outputs.json }}
