name: Dispatch Codegen

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  dispatch-codegen:
    runs-on: ubuntu-latest

    env:
      commit_message: ""
      pr_body: ""

    steps:
      - name: Get token
        uses: actions/create-github-app-token@v3.2.0 # This release is immutable, so pinning to a commit is not necessary
        id: app-token
        with:
          app-id: ${{ secrets.EIN_CODEGEN_APP_ID }}
          private-key: ${{ secrets.EIN_CODEGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          skip-token-revoke: true
          repositories: |
            einnsyn-codegen

      - name: Set commit message if triggered by a PR
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [[ "$COMMIT_MESSAGE" == *"Merge pull request"* ]]; then
            PR_NUMBER=$(echo "$COMMIT_MESSAGE" | grep -oP '(?<=#)\d+' | head -1)
            PR_TITLE=$(echo "$COMMIT_MESSAGE" | grep -v "^Merge pull request" | grep -v "^$" | head -1)
            echo "pr_body=Triggered from ${{ github.repository }} [#${PR_NUMBER}](https://github.com/${{ github.repository }}/pull/${PR_NUMBER}) ${PR_TITLE}" >> $GITHUB_ENV
            echo "commit_message=Triggered from ${{ github.repository }}#${PR_NUMBER}" >> $GITHUB_ENV
          else
            echo "pr_body=Triggered from ${{ github.repository }}" >> $GITHUB_ENV
            echo "commit_message=Triggered from ${{ github.repository }}" >> $GITHUB_ENV
          fi

      - name: Dispatch workflow
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # pin@v4.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: felleslosninger/einnsyn-codegen
          event-type: codegen
          client-payload: |
            {
              "commit_message": "${{ env.commit_message }}",
              "pr_body": "${{ env.pr_body }}"
            }
